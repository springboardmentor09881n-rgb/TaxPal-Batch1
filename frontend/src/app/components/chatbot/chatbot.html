<div class="chatbot-container" [class.open]="isOpen()" *ngIf="shouldShow()">
  <!-- Chat Window (opens above the toggle button) -->
  <div class="chat-window" *ngIf="isOpen()">
    <div class="chat-header">
      <button class="menu-btn" (click)="toggleSidebar()" title="Chat History">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <h4>TaxPal Assistant</h4>
      <button class="minimize-btn" (click)="toggleChat()" title="Minimize">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>
    
    <!-- Sidebar / Drawer overlay -->
    <div class="chat-sidebar" [class.open]="isSidebarOpen()">
      <div class="sidebar-header">
        <h5>Chat History</h5>
        <button class="close-sidebar-btn" (click)="toggleSidebar()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="sidebar-content">
        <button class="new-chat-btn" (click)="startNewChat()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px; vertical-align: middle;">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          New Chat
        </button>
        <div class="sessions-list">
          <div *ngFor="let session of sessions()" 
               class="history-item" 
               [class.active]="currentSessionId() === session._id"
               (click)="loadSession(session._id)">
            <div class="history-item-details">
              <span class="session-title">{{ session.title || 'New Conversation' }}</span>
              <span class="session-timestamp">{{ formatSessionTime(session.updatedAt) }}</span>
            </div>
            <button class="delete-session-btn" (click)="deleteSession(session._id, $event)" title="Delete Chat">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>
          <div *ngIf="sessions().length === 0" class="no-sessions">
            No previous chats
          </div>
        </div>
      </div>
      <!-- Global Clear All Button at Bottom -->
      <div class="sidebar-footer" *ngIf="sessions().length > 0">
        <button class="clear-all-btn" (click)="clearAllHistory()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          Clear All History
        </button>
      </div>
    </div>

    <!-- Message list -->
    <div class="chat-messages" (click)="isSidebarOpen() ? toggleSidebar() : null">
      <div *ngFor="let msg of messages()" class="message-wrapper" [class.user]="msg.role === 'user'">
        <div class="message-bubble" [innerHTML]="parseMessageContent(msg.content)">
        </div>
      </div>
      <div class="message-wrapper model" *ngIf="isLoading()">
        <div class="message-bubble loading">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>
    </div>

    <!-- Contextual Prebuilt Suggestion Chips -->
    <div class="prebuilt-questions">
      <button *ngFor="let chip of suggestionChips()" class="chip" (click)="sendPrebuiltMessage(chip.question)">
        {{ chip.label }}
      </button>
    </div>

    <!-- Chat Input -->
    <div class="chat-input-area">
      <input 
        type="text" 
        [(ngModel)]="userInput" 
        (keyup.enter)="sendMessage()" 
        placeholder="Ask me about your taxes or budget..." 
        [disabled]="isLoading()"
      />
      <button (click)="sendMessage()" [disabled]="isLoading() || !userInput().trim()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <!-- Chat Button (hidden when window is expanded) -->
  <button class="chat-toggle-btn" (click)="toggleChat()" [class.active]="isOpen()" title="Toggle Assistant" *ngIf="!isOpen()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
    </svg>
  </button>
</div>
